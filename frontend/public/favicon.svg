<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0f766e"/>
      <stop offset="50%"  stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Graduation cap -->
  <!-- Board (top flat part) -->
  <polygon points="32,12 56,24 32,36 8,24" fill="white" opacity="0.95"/>
  <!-- Cap body -->
  <rect x="21" y="24" width="22" height="14" rx="2" fill="white" opacity="0.85"/>
  <!-- Tassel string -->
  <line x1="56" y1="24" x2="56" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Tassel ball -->
  <circle cx="56" cy="40" r="3" fill="#facc15"/>
  <!-- Coin accent bottom-left -->
  <circle cx="16" cy="50" r="8" fill="#facc15" opacity="0.9"/>
  <text x="16" y="54" font-family="Arial,sans-serif" font-size="9" font-weight="900"
        text-anchor="middle" fill="#0f766e">₹</text>
</svg>
